# 植生学会誌 (Vegetation Science) の設定
# 雑誌ごとに違うものだけをここに置く．スクリプトの中に雑誌固有の値を書かない．

journal_id: vegsci          # J-STAGE の資料コード
issn:
  ppub: 1342-2448
  epub: 2189-4809
title:
  ja: 植生学会誌
  en: Vegetation Science
publisher:
  ja: 植生学会
  en: The Society of Vegetation Science
copyright_holder:
  ja: 植生学会
  en: The Society of Vegetation Science

# 原稿種別 (1ページ目の左上の帯) → J-STAGE の article-type と英語の種別名
article_types:
  総説:     {type: review-article,       en: Review}
  原著論文: {type: research-article,     en: Original Article}
  原著:     {type: research-article,     en: Original Article}
  短報:     {type: brief-report,         en: Short Communication}
  資料:     {type: other,                en: Data}
  特集:     {type: other,                en: Special Feature}
  寄稿:     {type: other,                en: Contribution}
  訂正:     {type: correction,           en: Correction}

# 体裁が変わった巻号 (2026-09-20 に jstage/pdf_fingerprint.py の二分探索で特定)．
# `from: [巻, 号]` から，次の項目の手前まで．scripts/layout.py が使う．
# 決めるのは PDF そのもの (layout.detect)．この表は食い違いに気づくための控え．
eras:
  - from: [13, 1]
    source: scan            # 紙をスキャンして OCR をかけた PDF → extract_scan.py
    refs_head: 文献
    paper: A4 (スキャナの紙．印刷物の判型とは限らない)
  - from: [13, 2]
    source: scan
    refs_head: 引用文献
  - from: [31, 2]
    source: dtp             # DTP で組んだ PDF → extract.py
    refs_head: 引用文献
    body_size: 9.9
    paper: 215x280mm
    category: 原著論文
  - from: [39, 1]
    source: dtp
    body_size: 9.2          # 版面も縦に 32mm 伸びた (239 → 271mm)
    paper: A4
    category: 原著論文
  - from: [40, 2]
    source: dtp
    body_size: 9.2
    paper: A4
    category: 原著          # 種別の印字が「原著論文」から「原著」へ

# 組版の判定に使う値 (単位は pt．InDesign で組まれた 2014 年頃の号で確かめた)
layout:
  header_y_max: 62          # これより上は柱とノンブル
  footer_y_min: 745         # これより下は脚注 (1ページ目の連絡先・受付日)
  body_size: 9.9            # 本文の字の大きさ
  ref_size: 8.5             # 引用文献の字の大きさ
  size_tol: 0.35
  indent_min: 5             # 行頭がこれ以上右にずれていたら段落の始まり (字下げ)
  ref_indent_max: 3         # 引用文献: 行頭のずれがこれ未満なら新しい文献 (ぶら下げ字下げ)
  heading_font: Gothic      # 見出しとキャプションの書体名に含まれる文字列
  heading1_size: 11.3       # 「■ はじめに」
  heading1_prefix: "■"
  heading2_size: 9.9        # 「水田面積の変遷と歴史性」(ゴシック体・本文と同じ大きさ)
  italic_font: Italic       # この文字列を含む書体は *斜体* にする
  caption_pattern: '^(図|表|Fig\.|Table)\s*(\d+)'

# 特別な扱いをする見出し
# 節の見出しの文言．号によって言い方が違い，英文の論文もある (13(1):51 など) ので並びで書く
sections:
  abstract: [摘要, 要約, 和文の要約, ABSTRACT, Abstract]   # → <abstract> (本文からは外す)
  ack: [謝辞, ACKNOWLEDGEMENT, ACKNOWLEDGEMENTS, ACKNOWLEDGMENT, ACKNOWLEDGMENTS,
        Acknowledgement, Acknowledgements, Acknowledgment, Acknowledgments]
  refs: [引用文献, 文献, REFERENCES, References, REFFERENCES]   # 1990 年代の和文は「文献」．
                                                     # REFFERENCES は 16(2):103 の原文の綴りの誤り
  appendix: [付録, APPENDIX, Appendix]

# 紙をスキャンした旧号 (extract_scan.py) 用の設定
scan:
  # 柱と透かしのうち，この雑誌に固有のもの (OCR が字を崩した形も並べる)．
  # NII-ELS が全ページに入れる「NII-Electronic Library Service」などは，
  # 雑誌によらないのでスクリプト側 (extract_scan.py の JUNK_COMMON) に置いてある．
  junk: '(Society|Sooiety|Sooietv|▽egetation|Vegetation Science$|Soienoe)'
  # 図表の題の見つけ方．OCR は約物を全角にし字も崩すので (「Tab且e 2．」)，
  # 上の layout.caption_pattern より緩く見る
  caption_pattern: '^(図|表|Fig|Tab)[^\d]{0,4}(\d+)'

# 引用文献の書式 (scripts/refs.py の規則を選ぶ)
reference_style: author-year

# DOI の形 (PDF に DOI が印刷されていない号で，下書きに入れる候補．必ず確かめる)
doi_template: "10.15031/vegsci.{volume}.{fpage}"
